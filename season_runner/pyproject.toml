[project]
name = "mishpacha"
version = "0.1.0"
description = "Runs a Sleeper fantasy football season"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "tenacity>=8.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "playwright>=1.45",
]

[project.scripts]
mish = "mishpacha.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mishpacha"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
